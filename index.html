const movies=[['Matrix',1999,'🇺🇸','Lana y Lilly Wachowski','Keanu Reeves, Laurence Fishburne, Carrie-Anne Moss, Hugo Weaving','Ciencia ficción · Acción','Thomas Anderson descubre que el mundo que conoce es una simulación creada por máquinas. Guiado por Morfeo y Trinity, deberá comprender su papel en una rebelión que cuestiona la naturaleza misma de la realidad.','#276a55'],['Interstellar',2014,'🇺🇸','Christopher Nolan','Matthew McConaughey, Anne Hathaway, Jessica Chastain, Michael Caine','Ciencia ficción · Drama','Ante una crisis que amenaza la supervivencia humana, un grupo de exploradores atraviesa un agujero de gusano en busca de un planeta habitable. El viaje pone a prueba los vínculos familiares y los límites del tiempo.','#536b86'],['Terminator 2: El juicio final',1991,'🇺🇸','James Cameron','Arnold Schwarzenegger, Linda Hamilton, Edward Furlong, Robert Patrick','Acción · Ciencia ficción','Un cíborg regresa del futuro para proteger al joven John Connor de un asesino mecánico más avanzado. Sarah Connor deberá enfrentarse al destino que amenaza a la humanidad.','#6b727b'],['Gladiator',2000,'🇺🇸','Ridley Scott','Russell Crowe, Joaquin Phoenix, Connie Nielsen, Richard Harris','Épica · Drama','Tras la traición que destruye su familia y su carrera, el general Máximo es esclavizado y obligado a luchar como gladiador. Su ascenso en la arena lo acerca a una confrontación con el emperador.','#91683e'],['Pulp Fiction',1994,'🇺🇸','Quentin Tarantino','John Travolta, Samuel L. Jackson, Uma Thurman, Bruce Willis','Crimen · Drama','Varias historias entrelazadas de criminales, boxeadores y personajes marginales convergen en Los Ángeles. Sus conversaciones y decisiones inesperadas alteran sus destinos.','#9a3e36'],['El señor de los anillos: La comunidad del anillo',2001,'🇳🇿','Peter Jackson','Elijah Wood, Ian McKellen, Viggo Mortensen, Sean Astin','Fantasía · Aventura','Frodo Bolsón hereda un anillo de enorme poder y emprende un viaje para impedir que caiga en manos del Señor Oscuro. Una comunidad de aliados se forma para acompañarlo hacia Mordor.','#617349'],['Origen',2010,'🇺🇸','Christopher Nolan','Leonardo DiCaprio, Joseph Gordon-Levitt, Elliot Page, Marion Cotillard','Ciencia ficción · Suspense','Dom Cobb dirige un equipo capaz de entrar en los sueños para extraer secretos. Una misión aparentemente imposible les exige implantar una idea en la mente de un objetivo.','#44748d'],['Blade Runner',1982,'🇺🇸','Ridley Scott','Harrison Ford, Rutger Hauer, Sean Young, Daryl Hannah','Ciencia ficción · Cine negro','En un futuro lluvioso de Los Ángeles, un expolicía recibe la misión de localizar replicantes fugitivos. La persecución le obliga a cuestionar qué significa ser humano.','#9a503d'],['Regreso al futuro',1985,'🇺🇸','Robert Zemeckis','Michael J. Fox, Christopher Lloyd, Lea Thompson, Crispin Glover','Aventura · Comedia','Marty McFly viaja accidentalmente a 1955 en una máquina del tiempo construida por Doc Brown. Para regresar a su época tendrá que conseguir que sus futuros padres se enamoren.','#a16e30'],['El caballero oscuro',2008,'🇺🇸','Christopher Nolan','Christian Bale, Heath Ledger, Aaron Eckhart, Gary Oldman','Acción · Crimen','Batman y sus aliados intentan frenar al crimen organizado de Gotham, pero la llegada del Joker desata una escalada de caos que pone a prueba sus principios.','#3d536d']];

const init={scores:{0:9,1:9,2:10,3:8,4:9,5:10,6:9,7:8},favorites:[0,1],pending:[8],collection:{2:['Blu-ray']},reviews:{},lists:[{name:'Mi top de ciencia ficción',ranked:true,ids:[1,0,2,6]}],following:['Juan'],profile:{name:'Mi perfil',bio:'El cine es mi pasión.',accent:'#e8ba70',avatar:'🎬',top:[0,1,2,5,7]}};let state;try{state=Object.assign(structuredClone(init),JSON.parse(localStorage.getItem('butak4')||'{}'))}catch(e){state=structuredClone(init)}for(const [k,v] of Object.entries(state.collection||{})){state.collection[k]=Array.isArray(v)?v:(v?[v]:[])}let page='inicio',selected=0,person='Juan',listIdx=0,filter='';const save=()=>{try{localStorage.setItem('butak4',JSON.stringify(state))}catch(e){alert('No hay espacio suficiente para guardar la fotografía. Prueba con una más pequeña.')}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const art=i=>`<div class="art" style="--a:${movies[i][7]}">${esc(movies[i][0])}</div>`;const poster=i=>`<div class="poster" onclick="openMovie(${i})">${art(i)}<div class="info"><strong>${esc(movies[i][0])}</strong><span class="muted">${movies[i][1]} · ★ ${state.scores[i]||'—'}</span></div></div>`;function go(p){page=p;render();scrollTo(0,0)}function openMovie(i){selected=i;go('ficha')}function toggle(k,i){state[k]=state[k]||[];state[k]=state[k].includes(i)?state[k].filter(x=>x!==i):[...state[k],i];save();render()}function section(t){return `<div class="section"><h2>${t}</h2></div>`}function nav(){document.getElementById('nav').innerHTML=[['inicio','⌂','Inicio'],['explorar','⌕','Explorar'],['listas','☷','Mis listas'],['juegos','🎮','Juegos'],['perfil','♙','Perfil']].map(([id,ico,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${t}</button>`).join('')}
function home(){return `<div class="hero"><div><div class="eyebrow">Película destacada</div><h1>INTERSTELLAR</h1><p>Un viaje más allá de los límites del espacio y del tiempo.</p><button class="gold" onclick="openMovie(1)">▶ Ver ficha</button></div></div>${section('★ Películas destacadas')}<div class="scroll">${movies.map((_,i)=>poster(i)).join('')}</div>${section('✦ Tus amigos han puntuado')}<div class="scroll">${people.map(p=>`<div class="card" style="min-width:170px;cursor:pointer" onclick="person='${p.name}';go('usuario')"><b>${p.name}</b><p>★ ${Object.values(p.scores).at(-1)} · Ver perfil</p></div>`).join('')}</div>${section('Tus accesos rápidos')}<div class="tiles"><button class="tile" onclick="go('listas')"><b>♥</b>Favoritos (${state.favorites.length})</button><button class="tile" onclick="go('listas')"><b>◷</b>Pendientes (${state.pending.length})</button><button class="tile" onclick="go('listas')"><b>▤</b>Colección</button><button class="tile" onclick="go('listas')"><b>🏆</b>Mis tops</button></div><div class="card"><h2>🎮 Juegos y desafíos</h2><p>Trivial de cine con resultado y clasificación de ejemplo.</p><button class="gold" onclick="go('juegos')">Jugar ahora ▶</button></div>`}
function detail(){let m=movies[selected],r=state.reviews[selected]||{};return `<button class="ghost" onclick="go('explorar')">← Volver</button><div class="card"><div class="detailTop">${art(selected)}<div><h1>${esc(m[0])}</h1><p>${m[2]} ${m[1]}</p><p class="muted">${m[5]}</p><p>★ Tu nota: <strong>${state.scores[selected]||'Sin puntuar'}</strong></p><div class="ratinggrid">${Array.from({length:10},(_,i)=>`<button class="ratingbtn ${state.scores[selected]===i+1?'picked':''}" onclick="state.scores[${selected}]=${i+1};save();render()">${i+1}</button>`).join('')}</div></div></div><div class="flex"><button class="ghost" onclick="toggle('favorites',${selected})">${state.favorites.includes(selected)?'♥ Quitar favorito':'♡ Favorito'}</button><button class="ghost" onclick="toggle('pending',${selected})">${state.pending.includes(selected)?'✓ Pendiente':'＋ Por ver'}</button><button class="ghost" onclick="addToList(${selected})">＋ Añadir a lista</button></div><div class="line"></div><p><b>Dirección:</b> ${m[3]}</p><p><b>Reparto:</b> ${m[4]}</p><h3>Sinopsis</h3><p>${m[6]}</p><h3>Mi colección física</h3><p class="muted">Marca todos los formatos que tengas de esta película.</p><div class="formatgrid">${['VHS','DVD','Blu-ray','4K UHD'].map(x=>`<label class="formatcheck"><input type="checkbox" ${(state.collection[selected]||[]).includes(x)?'checked':''} onchange="setFormat(${selected},'${x}',this.checked)"><span>${x}</span></label>`).join('')}</div><h3>Mi crítica</h3><textarea class="field" id="review" rows="4" placeholder="Escribe tu opinión...">${esc(r.text||'')}</textarea><select id="privacy" class="field"><option value="public" ${r.privacy==='public'?'selected':''}>🌍 Pública</option><option value="friends" ${r.privacy==='friends'?'selected':''}>👥 Solo amigos</option><option value="private" ${r.privacy==='private'?'selected':''}>🔒 Privada</option></select><button class="gold" onclick="state.reviews[${selected}]={text:document.getElementById('review').value,privacy:document.getElementById('privacy').value};save();render()">Guardar crítica</button>${r.text?`<p class="ok">✓ Crítica guardada · ${r.privacy==='private'?'Privada':r.privacy==='friends'?'Solo amigos':'Pública'}</p>`:''}</div><h3>Críticas de la comunidad (simulación)</h3><div class="card muted">Las críticas de otros usuarios aparecerán aquí al conectar cuentas y servidor. No se publican las tuyas desde esta demo.</div>`}

let collFormat='Todos',collGenre='Todos',collQuery='',collSort='az';

function updateCollectionResults(){let ids=Object.keys(state.collection).map(Number).filter(i=>state.collection[i]?.length&&(collFormat==='Todos'||state.collection[i].includes(collFormat))&&(collGenre==='Todos'||movies[i][5].includes(collGenre))&&[movies[i][0],movies[i][3],movies[i][4],movies[i][5]].join(' ').toLowerCase().includes(collQuery.toLowerCase()));ids.sort((a,b)=>collSort==='za'?movies[b][0].localeCompare(movies[a][0],'es'):collSort==='year'?movies[b][1]-movies[a][1]:movies[a][0].localeCompare(movies[b][0],'es'));document.getElementById('collectionResults').innerHTML=collectionResults(ids)}

ocument.getElementById('pavatar').value,accent:document.getElementById('paccent').value};save();render()">Guardar cambios</button></div><button class="ghost" onclick="logout()">Cerrar sesión de demostración</button>${section('Descubre cinéfilos')} ${people.map(p=>`<div class="item"><b>${p.name}</b><span>${similarity(p).pct}% compatible</span><button class="ghost" onclick="person='${p.name}';go('usuario')">Ver perfil</button></div>`).join('')}<p class="muted">Los perfiles de Juan, María y Álex son ficticios para probar la interfaz.</p>`}

const questionBank=[];
for(let k=0;k<factRows.length;k++){
  const [title,dir,year,actor,genre]=factRows[k];
  for(const [text,answer,col] of [[`¿Quién dirigió «${title}»?`,dir,1],[`¿En qué año se estrenó «${title}»?`,String(year),2],...(genre==='Animación'?[]:[[ `¿Quién participó en «${title}»?`,actor,3]])]){
    const pool=[...new Set(factRows.map(r=>String(r[col])))].filter(x=>x!==String(answer));
    const offset=(k*13+col*17)%pool.length;
    const wrong=[];
    for(let j=0;j<pool.length&&wrong.length<3;j++){
      const candidate=pool[(offset+j*23)%pool.length];
      if(!wrong.includes(candidate))wrong.push(candidate);
    }
    if(wrong.length===3)questionBank.push({id:`${k}-${col}`,text,options:[String(answer),...wrong],correct:0});
  }
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function startQuiz(){
 let seen=[];try{seen=JSON.parse(localStorage.getItem('butak_seen_questions')||'[]')}catch(e){}
 const unseen=shuffle(questionBank.filter(q=>!seen.includes(q.id)));
 const older=shuffle(questionBank.filter(q=>seen.includes(q.id)));
 const selected=[...unseen,...older].slice(0,20);
 const newSeen=[...seen,...selected.map(q=>q.id)].slice(-questionBank.length);
 try{localStorage.setItem('butak_seen_questions',JSON.stringify(newSeen))}catch(e){}
 quiz={i:0,correct:0,points:0,streak:0,locked:false,done:false,questions:selected.map(q=>{
  const opts=shuffle(q.options.map((x,i)=>({x,ok:i===q.correct})));
  return {text:q.text,options:opts.map(x=>x.x),correct:opts.findIndex(x=>x.ok)};
 })};render();
}
function answer(n){if(quiz.locked||quiz.done)return;quiz.locked=true;let q=quiz.questions[quiz.i],ok=n===q.correct;if(ok){quiz.correct++;quiz.streak++;quiz.points+=100+Math.min(quiz.streak-1,5)*10}else quiz.streak=0;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===n)b.classList.add('incorrect')});setTimeout(()=>{quiz.i++;quiz.locked=false;if(quiz.i>=quiz.questions.length){quiz.done=true;state.quizHistory=state.quizHistory||[];state.quizHistory.push({points:quiz.points,correct:quiz.correct,date:new Date().toISOString()});save()}if(page==='juegos')render()},1150)}
function scoreBoard(){let rows=state.quizHistory||[],month=new Date().toISOString().slice(0,7),total=rows.reduce((a,b)=>a+b.points,0),monthly=rows.filter(r=>r.date.startsWith(month)).reduce((a,b)=>a+b.points,0);return `<div class="tiles"><div class="tile"><b>${total}</b>Puntos históricos</div><div class="tile"><b>${monthly}</b>Puntos del mes</div><div class="tile"><b>${rows.length}</b>Partidas jugadas</div><div class="tile"><b>${Math.max(0,...rows.map(r=>r.points))}</b>Récord personal</div></div><p class="muted">Clasificación comunitaria pendiente de cuentas y servidor. Aquí solo se muestran tus resultados reales de este navegador.</p>`}
function games(){if(!quiz.questions.length)return `<div class="card"><h2>🎮 Campeonato cinéfilo</h2><p>20 preguntas aleatorias de un banco de ${questionBank.length}. 100 puntos por acierto, con bonificaciones por racha.</p><button class="gold" onclick="startQuiz()">Empezar partida</button></div>${scoreBoard()}`;if(quiz.done)return `<div class="card" style="text-align:center"><h2>🏆 Fin de la partida</h2><div class="stat">${quiz.points} puntos</div><p>${quiz.correct} aciertos · ${20-quiz.correct} fallos · ${Math.round(quiz.correct/20*100)}%</p><button class="gold" onclick="startQuiz()">Jugar otra partida</button></div>${scoreBoard()}`;let q=quiz.questions[quiz.i];return `<div class="card"><div class="eyebrow">Campeonato BUTAK</div><p class="muted">Pregunta ${quiz.i+1} de 20 · ${quiz.points} puntos · Racha ${quiz.streak}</p><div class="progress"><div style="width:${quiz.i*5}%"></div></div><h2>${q.text}</h2>${q.options.map((a,i)=>`<button class="field choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<p class="muted">La respuesta se ilumina y avanzamos automáticamente.</p></div>`}

async function tmdbRequest(path,params={}){if(!tmdbKey)throw Error('Falta configurar la API Key (v3).');const url=new URL(TMDB_BASE+path);url.searchParams.set('api_key',tmdbKey);url.searchParams.set('language','es-ES');for(const [k,v] of Object.entries(params))if(v!==undefined&&v!==null&&v!=='')url.searchParams.set(k,String(v));let res;try{res=await fetch(url.toString(),{headers:{Accept:'application/json'}})}catch(e){throw Error('No se pudo conectar. Comprueba que tienes Internet y que el navegador permite las consultas a TMDB.')}if(!res.ok){if(res.status===401)throw Error('TMDB no reconoce la clave. Revisa que hayas copiado la API Key (v3), no el token v4.');if(res.status===429)throw Error('Demasiadas consultas. Espera unos instantes.');throw Error('TMDB ha respondido con error '+res.status)}return res.json()}
function tmdbSetup(){return `<div class="card tmdb-setup"><div class="eyebrow">CATÁLOGO REAL</div><h2>Conectar BUTAK con TMDB</h2><p>Ya tienes tu cuenta de TMDB. Pega aquí tu <b>Clave de la API (v3)</b> —la corta— para buscar películas reales y ver sus carteles, repartos y fichas.</p><input id="tmdbkey" class="field" type="password" autocomplete="off" spellcheck="false" placeholder="API Key (v3) · 32 caracteres"><p id="tmdbkeymsg" class="tmdb-note"></p><button class="gold" onclick="tmdbSetKey()">Conectar catálogo</button><div class="tmdb-privacy"><p class="tmdb-note"><b>Privacidad de esta demo:</b> la clave se guarda solo en la sesión de esta pestaña, no en GitHub ni en las listas locales. Se envía directamente a TMDB en cada consulta y puede ser visible en las herramientas de red del navegador. No compartas públicamente esta demo con la clave introducida. Para una versión pública utilizaremos un servidor seguro.</p></div>${tmdbFoot()}</div>`}
function tmdbPoster(x){const type=x.media_type||((x.title||x.original_title)?'movie':'person');let title=type==='person'?x.name:(x.title||x.name||'Sin título');let photo=type==='person'?x.profile_path:x.poster_path;return `<button class="tmdb-card" onclick="${type==='person'?`tmdbOpenPerson(${x.id})`:`tmdbOpen(${x.id})`}">${photo?`<img loading="lazy" src="${tmdbImage(photo)}" alt="Cartel o foto de ${esc(title)}">`:`<div class="art" style="height:auto;aspect-ratio:2/3">${esc(title)}</div>`}<div class="info"><strong>${esc(title)}</strong><span class="muted">${type==='person'?'Intérprete / cineasta':(x.release_date||'').slice(0,4)||'Año no disponible'}${x.vote_average?' · ★ '+Number(x.vote_average).toFixed(1):''}</span></div></button>`}
function tmdbList(){if(!tmdbKey)return tmdbSetup();let genres=['popular','top_rated','now_playing','upcoming'];return `<div class="tmdb-head"><div class="eyebrow">TMDB · EN DIRECTO</div><h2>El universo del cine</h2><p>Busca entre el catálogo de TMDB. Las películas se consultan por Internet, no se descargan todas al móvil.</p><div class="tmdb-controls"><input class="field" id="tmdbsearch" placeholder="Película, actor o director…" value="${esc(tmdbQuery)}" oninput="tmdbSearchChanged(this.value)"><button class="ghost" onclick="tmdbSearchNow()">Buscar</button></div><div class="tmdb-controls">${[['popular','Populares'],['top_rated','Mejor valoradas'],['now_playing','En cartelera'],['upcoming','Próximamente']].map(([k,v])=>`<button class="${tmdbMode===k?'gold':'ghost'}" onclick="tmdbChoose('${k}')">${v}</button>`).join('')}</div><div class="tmdb-controls"><button class="ghost" onclick="tmdbForget()">Cambiar clave TMDB</button></div></div>${tmdbError?`<div class="tmdb-error">${esc(tmdbError)}</div>`:''}${tmdbBusy?'<div class="tmdb-loading">Consultando TMDB…</div>':''}<div id="tmdbresults" class="tmdb-grid">${tmdbItems.map(tmdbPoster).join('')}</div>${tmdbItems.length?`<div class="tmdb-controls"><button class="ghost" ${tmdbPage<=1?'disabled':''} onclick="tmdbChangePage(-1)">← Anterior</button><span class="muted">Página ${tmdbPage}</span><button class="ghost" onclick="tmdbChangePage(1)">Siguiente →</button></div>`:''}${tmdbFoot()}`}
function tmdbSearchChanged(value){tmdbQuery=value;clearTimeout(tmdbSearchTimer);tmdbSearchTimer=setTimeout(tmdbSearchNow,500)}
function tmdbSearchNow(){tmdbMode=tmdbQuery.trim()?'search':'popular';tmdbPage=1;tmdbLoad()}

let tmdbLoadSeq=0;
async function tmdbLoad(){if(!tmdbKey){go('catalogo');return}let seq=++tmdbLoadSeq;tmdbBusy=true;tmdbError='';page='catalogo';render();try{let data;if(tmdbMode==='search')data=await tmdbRequest('/search/multi',{query:tmdbQuery,page:tmdbPage,include_adult:false});else data=await tmdbRequest('/movie/'+tmdbMode,{page:tmdbPage,region:'ES'});if(seq!==tmdbLoadSeq)return;tmdbItems=(data.results||[]).filter(x=>x.media_type!=='tv'&&x.media_type!=='collection'&&x.media_type!=='company');if(!tmdbItems.length)tmdbError='No hay resultados. Prueba con otro título o nombre.'}catch(e){if(seq!==tmdbLoadSeq)return;tmdbError=e.message;tmdbItems=[]}finally{if(seq===tmdbLoadSeq){tmdbBusy=false;if(page==='catalogo')render()}}}
async function tmdbOpen(id){page='tmdbficha';tmdbCurrent=null;tmdbCredits=null;tmdbVideos=[];tmdbError='';render();try{const [movie,credits,videos]=await Promise.all([tmdbRequest('/movie/'+id,{append_to_response:'release_dates'}),tmdbRequest('/movie/'+id+'/credits'),tmdbRequest('/movie/'+id+'/videos')]);tmdbCurrent=movie;tmdbCredits=credits;tmdbVideos=videos.results||[]}catch(e){tmdbError=e.message}if(page==='tmdbficha')render();scrollTo(0,0)}
async function tmdbOpenPerson(id){page='tmdbpersona';tmdbPerson=null;tmdbError='';render();try{const [person,credits]=await Promise.all([tmdbRequest('/person/'+id),tmdbRequest('/person/'+id+'/combined_credits')]);tmdbPerson={...person,works:(credits.cast||[]).concat(credits.crew||[]).filter(x=>x.media_type==='movie').sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,32)}}catch(e){tmdbError=e.message}if(page==='tmdbpersona')render();scrollTo(0,0)}
function tmdbPersonPage(){if(tmdbError)return `<div class="tmdb-error">${esc(tmdbError)}</div><button class="ghost" onclick="go('catalogo')">Volver</button>`;if(!tmdbPerson)return '<div class="tmdb-loading">Cargando filmografía…</div>';let p=tmdbPerson;return `<button class="ghost" onclick="go('catalogo')">← Catálogo</button><div class="card tmdb-detail">${p.profile_path?`<img src="${tmdbImage(p.profile_path,'w342')}" alt="${esc(p.name)}">`:''}<div><h1>${esc(p.name)}</h1><p class="muted">${esc(p.known_for_department||'Cine')} · ${esc(p.place_of_birth||'')}</p><p>${esc((p.biography||'Biografía no disponible en español.').slice(0,1200))}</p></div></div>${section('Filmografía destacada')}<div class="tmdb-grid">${p.works.map(tmdbPoster).join('')}</div>${tmdbFoot()}`}

function tmdbDetail(){if(tmdbError)return `<div class="tmdb-error">${esc(tmdbError)}</div><button class="ghost" onclick="go('catalogo')">Volver</button>`;if(!tmdbCurrent)return '<div class="tmdb-loading">Cargando ficha, reparto y carteles…</div>';const m=tmdbCurrent,id=m.id,crew=tmdbCredits?.crew||[],cast=tmdbCredits?.cast||[],directors=crew.filter(x=>x.job==='Director'),score=state.tmdb.scores[id],review=state.tmdb.reviews[id]||{},trailer=tmdbVideos.find(x=>x.site==='YouTube'&&x.type==='Trailer');return `<button class="ghost" onclick="go('catalogo')">← Volver al catálogo</button>${m.backdrop_path?`<div class="tmdb-banner" style="background-image:url('${tmdbImage(m.backdrop_path,'w1280')}')"></div>`:''}<div class="card"><div class="tmdb-detail">${m.poster_path?`<img src="${tmdbImage(m.poster_path,'w500')}" alt="Cartel de ${esc(m.title)}">`:''}<div><div class="eyebrow">FICHA OFICIAL TMDB</div><h1>${esc(m.title)}</h1><p class="muted">${esc((m.release_date||'').slice(0,4))} · ${m.runtime?m.runtime+' min · ':''}${esc((m.production_countries||[]).map(c=>c.name).join(', '))}</p><p>${(m.genres||[]).map(g=>`<span class="tmdb-badge">${esc(g.name)}</span>`).join('')}</p><p>★ TMDB: ${m.vote_average?Number(m.vote_average).toFixed(1)+'/10':'Sin nota'} <span class="muted">(${m.vote_count||0} votos)</span></p><p>★ Tu nota BUTAK: <b>${score||'Sin puntuar'}</b></p></div></div><h3>Tu puntuación</h3><div class="ratinggrid">${Array.from({length:10},(_,i)=>`<button class="ratingbtn ${score===i+1?'picked':''}" onclick="tmdbRate(${id},${i+1})">${i+1}</button>`).join('')}</div><div class="tmdb-actions"><button class="ghost" onclick="tmdbToggle(${id},'favorites')">${state.tmdb.favorites.includes(id)?'♥ Favorita':'♡ Favoritos'}</button><button class="ghost" onclick="tmdbToggle(${id},'pending')">${state.tmdb.pending.includes(id)?'✓ Por ver':'＋ Pendientes'}</button><button class="ghost" onclick="tmdbAddToList(${id})">＋ Añadir a lista</button>${trailer?`<button class="ghost" onclick="window.open('https://www.youtube.com/watch?v=${encodeURIComponent(trailer.key)}','_blank','noopener')">▶ Tráiler</button>`:''}</div><h3>Sinopsis</h3><p>${esc(m.overview||'Sinopsis no disponible en español.')}</p><p><b>Dirección:</b> ${directors.length?directors.map(p=>`<span class="tmdb-link" onclick="tmdbOpenPerson(${p.id})">${esc(p.name)}</span>`).join(', '):'No disponible'}</p><p><b>Título original:</b> ${esc(m.original_title||'')}</p><p><b>Estreno:</b> ${esc(m.release_date||'No disponible')}</p><h3>Reparto</h3><div class="tmdb-cast">${cast.slice(0,18).map(p=>`<div onclick="tmdbOpenPerson(${p.id})" style="cursor:pointer">${p.profile_path?`<img loading="lazy" src="${tmdbImage(p.profile_path,'w185')}" alt="${esc(p.name)}">`:'<div class="art" style="height:125px">Sin foto</div>'}<b>${esc(p.name)}</b><div class="muted">${esc(p.character||'')}</div></div>`).join('')}</div><h3>Mi colección física</h3><p class="tmdb-note">Puedes marcar varios formatos para la misma película.</p><div class="formatgrid">${['VHS','DVD','Blu-ray','4K UHD'].map(f=>`<label class="formatcheck"><input type="checkbox" ${(state.tmdb.collection[id]||[]).includes(f)?'checked':''} onchange="tmdbFormat(${id},'${f}',this.checked)"><span>${f}</span></label>`).join('')}</div><h3>Mi crítica</h3><textarea id="tmdbreview" class="field" rows="4" placeholder="Tu opinión…">${esc(review.text||'')}</textarea><select class="field" id="tmdbprivacy"><option value="public" ${review.privacy==='public'?'selected':''}>Pública (cuando haya comunidad)</option><option value="friends" ${review.privacy==='friends'?'selected':''}>Solo amigos (cuando haya comunidad)</option><option value="private" ${review.privacy==='private'?'selected':''}>Privada</option></select><button class="gold" onclick="tmdbSaveReview(${id})">Guardar crítica local</button><p class="tmdb-note">Las críticas, notas y listas se guardan solo en este navegador. No se publican ni se sincronizan con otros usuarios.</p></div>${tmdbFoot()}`}

${section('Películas para descubrir')}<div class="tmdb-grid">${tmdbItems.slice(0,12).map(tmdbPoster).join('')}</div><div class="tmdb-controls"><button class="ghost" onclick="tmdbChooseHome('top_rated')">★ Mejor valoradas</button><button class="ghost" onclick="tmdbChooseHome('now_playing')">En cartelera</button><button class="ghost" onclick="tmdbChooseHome('popular')">Populares</button></div>${section('Tus favoritas')}${state.tmdb.favorites.length?liveCards(state.tmdb.favorites.slice(0,8)):'<p class="muted">Guarda películas desde sus fichas y aparecerán aquí.</p>'}${section('Campeonato cinéfilo')}<div class="card"><p>20 preguntas aleatorias · ${questionBank.length} preguntas disponibles.</p><button class="gold" onclick="go('juegos')">Jugar ahora</button></div>${tmdbFoot()}`}

="muted">Añade películas desde sus fichas y aparecerán aquí automáticamente.</p><button class="gold" onclick="go('explorar')">Explorar películas</button></div>`})()}${tmdbFoot()}`};

function butakBrowsePanel(){const year=new Date().getFullYear();const years=[['','Cualquier año'],...Array.from({length:year-1894},(_,i)=>[String(year-i),String(year-i)])];const decades=[['','Todas las décadas'],...Array.from({length:14},(_,i)=>{let d=2020-i*10;return [String(d),`${d}–${d+9}`]})];const letters=[['','Todas las letras'],...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>[x,x])];return `<div class="card"><div class="tmdb-controls"><input id="liveSearch" class="field" placeholder="Película, actor, director o género…" value="${esc(liveQuery)}" oninput="liveSearchInput(this.value)" onkeydown="if(event.key==='Enter')liveSearchNow()"><button class="gold" onclick="liveSearchNow()">Buscar</button></div><h3>Explorar por género</h3>${butakGenreChips()}<h3>Explorar por año, década y orden</h3><div class="explore-filters"><label>Año<select class="field" onchange="butakBrowseSelect('year',this.value)">${butakSelectOptions(years,butakBrowseYear)}</select></label><label>Década<select class="field" onchange="butakBrowseSelect('decade',this.value)">${butakSelectOptions(decades,butakBrowseDecade)}</select></label><label>Inicial A–Z<select class="field" onchange="butakBrowseSelect('letter',this.value)">${butakSelectOptions(letters,butakBrowseLetter)}</select></label><label>Ordenar<select class="field" onchange="butakBrowseSelect('sort',this.value)">${butakSelectOptions([['popularity.desc','Popularidad'],['vote_average.desc','Mejor valoradas'],['primary_release_date.desc','Más recientes'],['primary_release_date.asc','Más antiguas'],['original_title.asc','Título A–Z']],butakBrowseSort)}</select></label></div><div class="tmdb-controls">${[['popular','Populares'],['top_rated','Mejor valoradas'],['now_playing','En cartelera'],['upcoming','Próximamente']].map(([k,v])=>`<button class="${tmdbMode===k?'gold':'ghost'}" onclick="liveCategory('${k}')">${v}</button>`).join('')}</div><p class="muted" style="font-size:12px">Los filtros se combinan; la búsqueda libre por nombre funciona por separado. El filtro A–Z selecciona la inicial del título original.</p></div>`}

tmdbLoad=async function(){if(!tmdbKey){render();return}const seq=++tmdbLoadSeq;tmdbBusy=true;tmdbError='';render();try{let data;if(tmdbMode==='browse'||tmdbMode==='genre'){const params={page:tmdbPage,sort_by:butakBrowseSort,include_adult:false,include_video:false,'vote_count.gte':butakBrowseSort==='vote_average.desc'?40:0};if(butakActiveGenre)params.with_genres=butakActiveGenre;if(butakBrowseYear)params.primary_release_year=butakBrowseYear;else if(butakBrowseDecade){params['primary_release_date.gte']=butakBrowseDecade+'-01-01';params['primary_release_date.lte']=(+butakBrowseDecade+9)+'-12-31'}if(butakBrowseLetter){params.with_original_language=undefined;params['with_keywords']=undefined}data=await tmdbRequest('/discover/movie',params)}else if(tmdbMode==='search')data=await tmdbRequest('/search/multi',{query:tmdbQuery,page:tmdbPage,include_adult:false});else data=await tmdbRequest('/movie/'+tmdbMode,{page:tmdbPage,region:'ES'});if(seq!==tmdbLoadSeq)return;let items=(data.results||[]).filter(x=>x.title&&x.media_type!=='tv');if(tmdbMode==='browse'&&butakBrowseLetter)items=items.filter(x=>(x.original_title||x.title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().startsWith(butakBrowseLetter));tmdbItems=[...new Map(items.map(x=>[x.id,x])).values()];tmdbItems.forEach(rememberFilm);if(!tmdbItems.length)tmdbError='No se han encontrado películas en esta página con los filtros seleccionados.'}catch(e){if(seq!==tmdbLoadSeq)return;tmdbError=e.message;tmdbItems=[]}finally{if(seq===tmdbLoadSeq){tmdbBusy=false;render()}}};

    }catch(e){const el=document.getElementById('butakTopResults');if(el)el.innerHTML=`<p class="tmdb-error">${esc(e.message)}</p>`}

const butakHideModalOriginal=hideModal;

<script>

for(let i=0;i<factRows.length;i++){
 const [title,dir,year,actor,genre]=factRows[i];
 const choices=(arr,answer,seed)=>{const others=[...new Set(arr.map(String))].filter(x=>x!==String(answer));if(others.length<3)return null;return [String(answer),...others.sort((a,b)=>((a.length*17+seed)%97)-((b.length*17+seed)%97)).slice(0,3)]};
 const uniqueTitle=(factRows.filter(r=>r[1]===dir&&r[2]===year).length===1);
 if(uniqueTitle){const opts=choices(factRows.filter(r=>r[0]!==title).map(r=>r[0]),title,i*3);if(opts)questionBank.push({id:'extra-film-'+i,text:`¿Qué película dirigió ${dir} en ${year}?`,options:opts,correct:0})}
 const sameGenre=factRows.filter(r=>r[4]===genre&&r[0]!==title).map(r=>r[0]);
 const otherGenres=factRows.filter(r=>r[4]!==genre).map(r=>r[0]);
 if(sameGenre.length&&otherGenres.length>=3){const opts=choices(otherGenres,title,i*5);if(opts)questionBank.push({id:'extra-genre-'+i,text:`Según las categorías de BUTAK, ¿cuál de estas películas pertenece al género ${genre}?`,options:opts,correct:0})}
}
let bkDaily=null,bkDailyLoading=false,bkDailyError='',bkRankGenre=0,bkRankYear='',bkRankDecade='',bkRankData=[],bkRankBusy=false,bkRankError='',bkRankSeq=0;

const bkGenres=[['Todos',0],['Acción',28],['Aventura',12],['Animación',16],['Comedia',35],['Crimen',80],['Documental',99],['Drama',18],['Familiar',10751],['Fantasía',14],['Historia',36],['Terror',27],['Música',10402],['Misterio',9648],['Romance',10749],['Ciencia ficción',878],['Suspense',53],['Bélico',10752],['Western',37]];
const bkDate=()=>new Date().toLocaleDateString('en-CA');
const bkFmt=n=>Number(n||0).toFixed(1).replace('.',',');
const bkPoster=m=>m.poster_path?`<img loading="lazy" src="${tmdbImage(m.poster_path,'w185')}" alt="${esc(m.title)}">`:'<div class="art">🎬</div>';
function bkYearOptions(){let current=new Date().getFullYear();return `<option value="">Todos los años</option>`+Array.from({length:current-1894},(_,i)=>current-i).map(y=>`<option value="${y}" ${String(y)===String(bkRankYear)?'selected':''}>${y}</option>`).join('')}
function bkGenreOptions(selected){return bkGenres.map(([label,id])=>`<option value="${id}" ${Number(selected)===id?'selected':''}>${label}</option>`).join('')}
async function bkFetchRank(genre=0,year='',decade='',max=50){
 const params={sort_by:'vote_average.desc','vote_count.gte':300,include_adult:false,include_video:false};
 if(genre)params.with_genres=genre;
 if(year)params.primary_release_year=year;
 else if(decade){params['primary_release_date.gte']=decade+'-01-01';params['primary_release_date.lte']=(Number(decade)+9)+'-12-31'}
 const out=[],seen=new Set();
 // TMDB devuelve hasta 20 películas por página: se consultan tantas como se necesiten.
 for(let page=1;page<=Math.ceil(max/20)+2&&out.length<max;page++){
  const data=await tmdbRequest('/discover/movie',{...params,page});
  for(const film of data.results||[]){if(film.id&&!seen.has(film.id)&&film.vote_count>=300){seen.add(film.id);out.push(film);rememberFilm(film)}}
  if(page>=Number(data.total_pages||1))break;
 }
 return out.slice(0,max);

async function bkLoadDaily(){

 bkDailyLoading=true;bkDailyError='';
 try{
  const genres=[18,27,878,37,35,28,10752,9648,16,80,14,12,36,10749];
  let hash=0;for(const ch of date)hash=(hash*31+ch.charCodeAt(0))>>>0;
  const genre=genres[hash%genres.length];const decade=1930+(Math.floor(hash/genres.length)%10)*10;
  let pool=await tmdbRequest('/discover/movie',{with_genres:genre,'primary_release_date.gte':decade+'-01-01','primary_release_date.lte':(decade+9)+'-12-31','vote_count.gte':150,sort_by:'vote_count.desc',page:1,include_adult:false});

  const film=choices[Math.floor(hash/31)%choices.length];rememberFilm(film);bkDaily={date,film,genre,decade};
 }catch(e){bkDailyError=e.message}finally{bkDailyLoading=false;if(page==='inicio')render()}
}
const bkHomeOld=liveHome;

 // Sustituir la cabecera hero original, sin alterar el resto de Inicio.
 const heroStart=html.indexOf('<div class="hero"');if(heroStart>=0){const end=html.indexOf('<div class="immersive-section"',heroStart);if(end>=0)html=html.slice(0,heroStart)+featured+html.slice(end)}
 if(!bkDailyLoading&&(!bkDaily||bkDaily.date!==bkDate())&&!bkDailyError)queueMicrotask(bkLoadDaily);
 return html.replace(/<div class="immersive-section"><h2>Descubre historias/,`<div class="immersive-section"><h2>🏆 Rankings TMDB</h2><button class="ghost" onclick="bkGoRank()">Ver mejores valoradas →</button></div><div class="immersive-section"><h2>Descubre historias`);
};
function bkGoRank(){page='bkrank';render();if(tmdbKey&&!bkRankData.length)bkLoadRank();window.scrollTo(0,0)}
async function bkLoadRank(){if(!tmdbKey)return;const seq=++bkRankSeq;bkRankBusy=true;bkRankError='';render();try{const rows=await bkFetchRank(bkRankGenre,bkRankYear,bkRankDecade,50);if(seq!==bkRankSeq)return;bkRankData=rows}catch(e){if(seq!==bkRankSeq)return;bkRankError=e.message}finally{if(seq===bkRankSeq){bkRankBusy=false;render()}}}
function bkRankFilter(type,val){if(type==='genre')bkRankGenre=Number(val);if(type==='year'){bkRankYear=val;if(val)bkRankDecade=''}if(type==='decade'){bkRankDecade=val;if(val)bkRankYear=''}bkRankData=[];bkLoadRank()}
function bkRankPage(){return `<div class="immersive-kicker">✦ CLASIFICACIONES PÚBLICAS</div><h1>🏆 Top TMDB</h1><p class="muted">Películas ordenadas por nota media TMDB. Mínimo 300 votos para evitar resultados poco representativos. No son notas de BUTAK.</p>${!tmdbKey?liveConnect():`<div class="card"><div class="tmdb-controls"><label>Género<select class="field" onchange="bkRankFilter('genre',this.value)">${bkGenreOptions(bkRankGenre)}</select></label><label>Año<select class="field" onchange="bkRankFilter('year',this.value)">${bkYearOptions()}</select></label><label>Década<select class="field" onchange="bkRankFilter('decade',this.value)"><option value="">Todas</option>${Array.from({length:13},(_,i)=>2020-i*10).map(d=>`<option value="${d}" ${String(bkRankDecade)===String(d)?'selected':''}>${d}s</option>`).join('')}</select></label></div><button class="ghost" onclick="bkLoadRank()">Actualizar clasificación</button></div>${bkRankBusy?'<p>Consultando valoraciones de TMDB…</p>':''}${bkRankError?`<p class="tmdb-error">${esc(bkRankError)}</p>`:''}<div>${bkRankData.map((m,i)=>`<div class="bk-rank-row" onclick="tmdbOpen(${m.id})" style="cursor:pointer"><strong style="min-width:30px">${i+1}.</strong>${bkPoster(m)}<div class="bk-rank-title"><strong>${esc(m.title)}</strong><div class="muted">${esc((m.release_date||'').slice(0,4))} · ${Number(m.vote_count).toLocaleString('es-ES')} votos</div></div><strong>★ ${bkFmt(m.vote_average)}</strong></div>`).join('')}</div>${tmdbFoot()}`}`}
function bkGameHome(){return `<div class="immersive-kicker">✦ BUTAK ARCADE</div><h1>🎮 Juegos de cine</h1><div class="bk-tabs"><button class="${bkGameTab==='trivia'?'gold':'ghost'}" onclick="bkGameTab='trivia';render()">🧠 Trivial</button><button class="${bkGameTab==='tier'?'gold':'ghost'}" onclick="bkGameTab='tier';render()">🏆 Tier Challenge</button></div>${bkGameTab==='trivia'?bkTriviaOld():bkTierPage()}`}
const bkTriviaOld=games;games=bkGameHome;
function bkTierStartGenre(v){bkChallengeGenre=Number(v);bkChallenge=[];bkChallengePicks=[];bkChallengeScores={};bkChallengeDone=false;bkChallengeResult=null;bkChallengeError='';render()}
async function bkTierLoad(){if(!tmdbKey){render();return}const seq=++bkChallengeSeq;bkChallengeBusy=true;bkChallengeError='';bkChallenge=[];bkChallengePicks=[];bkChallengeScores={};bkChallengeDone=false;bkChallengeResult=null;render();try{bkChallenge=await bkFetchRank(bkChallengeGenre,'','',50);if(seq!==bkChallengeSeq)return;if(bkChallenge.length<10)throw Error('Este género no tiene suficientes películas con 300 votos. Prueba otro.')}catch(e){if(seq!==bkChallengeSeq)return;bkChallengeError=e.message}finally{if(seq===bkChallengeSeq){bkChallengeBusy=false;render()}}}
function bkTierToggle(id){if(bkChallengeDone)return;const idx=bkChallengePicks.indexOf(id);if(idx>=0)bkChallengePicks.splice(idx,1);else{if(bkChallengePicks.length>=10){alert('Solo puedes elegir 10 películas. Quita una antes de añadir otra.');return}bkChallengePicks.push(id)}render()}
function bkTierMove(i,delta){const j=i+delta;if(j<0||j>=bkChallengePicks.length)return;[bkChallengePicks[i],bkChallengePicks[j]]=[bkChallengePicks[j],bkChallengePicks[i]];render()}
function bkTierSetScore(id,val){const n=Number(String(val).replace(',','.'));if(Number.isFinite(n)&&n>=1&&n<=10)bkChallengeScores[id]=Math.round(n*10)/10;else delete bkChallengeScores[id]}
function bkTierSubmit(){if(bkChallengePicks.length!==10){alert('Selecciona 10 películas.');return}if(bkChallengePicks.some(id=>!Number.isFinite(bkChallengeScores[id]))){alert('Introduce una nota de 1,0 a 10,0 para cada película.');return}
 const truth=bkChallenge.slice(0,10),topIds=new Set(truth.map(m=>m.id));let selectedPoints=0,orderPoints=0,notePoints=0,exact=0;const rows=[];
 for(let i=0;i<10;i++){
  const id=bkChallengePicks[i],film=bkChallenge.find(m=>m.id===id),realPos=bkChallenge.findIndex(m=>m.id===id)+1,guess=bkChallengeScores[id];

  const actual=Math.round(Number(film.vote_average)*10)/10;

  rows.push({film,rank:i+1,realPos,guess,actual,diff});
 }
 const total=selectedPoints+orderPoints+notePoints+exact*250;
 bkChallengeResult={rows,truth,selectedPoints,orderPoints,notePoints,exact,total};bkChallengeDone=true;
 state.tierHistory=state.tierHistory||[];state.tierHistory.push({genre:bkChallengeGenre,date:new Date().toISOString(),total,correct:rows.filter(r=>r.realPos<=10).length,exact});save();render();window.scrollTo(0,0);
}
function bkTierPage(){let rows=state.tierHistory||[];return `<h2>Tier Challenge</h2><p class="muted">Entre las 50 mejor valoradas del género, elige el top 10, ordénalo y adivina sus notas con un decimal. No se muestran las notas hasta terminar.</p>${!tmdbKey?liveConnect():`<div class="card"><label>Género<select class="field" onchange="bkTierStartGenre(this.value)">${bkGenreOptions(bkChallengeGenre).replace('<option value="0"','<option disabled value="0"')}</select></label><button class="gold" onclick="bkTierLoad()">${bkChallenge.length?'Nueva partida':'Preparar 50 películas'}</button><p class="muted">La selección usa TMDB en directo, con un mínimo de 300 votos por película. Las notas se fijan para esta partida al cargar las 50.</p></div>${bkChallengeBusy?'<p>Preparando el desafío…</p>':''}${bkChallengeError?`<p class="tmdb-error">${esc(bkChallengeError)}</p>`:''}${bkChallengeDone?bkTierResults():bkChallenge.length?bkTierBoard():''}`}<div class="card"><h3>Mis resultados</h3><p>${rows.length} partidas · Récord: ${Math.max(0,...rows.map(x=>x.total)).toLocaleString('es-ES')} puntos</p><p class="muted">Resultados guardados en este navegador. El ranking entre usuarios requerirá cuentas y servidor.</p></div>`}
function bkTierBoard(){return `<div class="card"><h3>Tu top 10 · ${bkChallengePicks.length}/10</h3><p class="muted">Sube o baja cada película con las flechas. Introduce tu nota estimada (1,0–10,0).</p>${bkChallengePicks.map((id,i)=>{const m=bkChallenge.find(x=>x.id===id);return `<div class="bk-rank-row"><strong>${i+1}</strong>${bkPoster(m)}<div class="bk-rank-title">${esc(m.title)}</div><input class="field" type="number" min="1" max="10" step="0.1" inputmode="decimal" placeholder="Nota" value="${bkChallengeScores[id]??''}" onchange="bkTierSetScore(${id},this.value)" oninput="bkTierSetScore(${id},this.value)"><button class="ghost" onclick="bkTierMove(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="ghost" onclick="bkTierMove(${i},1)" ${i===bkChallengePicks.length-1?'disabled':''}>↓</button><button class="ghost" onclick="bkTierToggle(${id})">×</button></div>`}).join('')}<button class="gold" onclick="bkTierSubmit()" ${bkChallengePicks.length!==10?'disabled':''}>Revelar resultados y puntuar →</button></div><h3>50 películas candidatas · notas ocultas</h3><div class="bk-challenge-grid">${bkChallenge.map(m=>`<button class="bk-pick ${bkChallengePicks.includes(m.id)?'picked':''}" onclick="bkTierToggle(${m.id})">${bkPoster(m)}<small>${esc(m.title)} (${esc((m.release_date||'').slice(0,4))})</small></button>`).join('')}</div>${tmdbFoot()}`}
function bkTierResults(){const r=bkChallengeResult;return `<div class="card"><h2>🏆 ${r.total.toLocaleString('es-ES')} / 19.500 puntos</h2><div class="tiles"><div class="tile"><b>${r.selectedPoints.toLocaleString('es-ES')}</b>Selección / 5.000</div><div class="tile"><b>${r.orderPoints.toLocaleString('es-ES')}</b>Orden / 2.000</div><div class="tile"><b>${r.notePoints.toLocaleString('es-ES')}</b>Notas / 10.000</div><div class="tile"><b>${r.exact*250}</b>Bonus exactos</div></div><p>${r.exact} notas exactas · ${r.rows.filter(x=>x.realPos<=10).length} películas del top real</p><button class="gold" onclick="bkTierLoad()">Volver a jugar</button></div><h3>Tu clasificación frente a TMDB</h3><div class="card" style="overflow-x:auto"><table class="bk-result-table"><thead><tr><th>Tu #</th><th>Película</th><th>TMDB #</th><th>Tu nota</th><th>Real</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.film.title)}</td><td>${x.realPos}</td><td>${bkFmt(x.guess)}</td><td><strong>${bkFmt(x.actual)}</strong>${x.diff===0?' 🎯':''}</td></tr>`).join('')}</tbody></table></div><h3>Top 10 real del desafío</h3>${r.truth.map((m,i)=>`<div class="bk-rank-row"><strong>${i+1}</strong>${bkPoster(m)}<div class="bk-rank-title">${esc(m.title)}</div><strong>★ ${bkFmt(m.vote_average)}</strong></div>`).join('')}${tmdbFoot()}`}
const bkRenderOld=render;
render=function(){if(!session){bkRenderOld();return}if(page==='bkrank'){applyTheme();nav();document.getElementById('view').innerHTML=bkRankPage();return}bkRenderOld()};
// Mostrar rankings en el explorador y acceso visible al juego.
const bkExploreOld=liveExplore;
liveExplore=function(){return `<div class="card"><strong>🏆 Clasificaciones públicas de TMDB</strong><p class="muted">Top general, por género, año y década.</p><button class="gold" onclick="bkGoRank()">Abrir Top TMDB →</button></div>`+bkExploreOld()};
// No cargar la destacada hasta que se haya iniciado la sesión y conectado TMDB.
if(session&&tmdbKey)bkLoadDaily();
document.title='BUTAK 1.3 · Cinema Immersive';render();
</script>

<script>
/* BUTAK 1.3.2: críticas de BUTAK y reseñas externas TMDB diferenciadas. */
let bkReviewTab='butak',bkExternalReviews=[],bkExternalLoading=false,bkExternalError='',bkExternalPage=1,bkExternalTotal=0,bkExternalMovie=null,bkExternalSeq=0,bkReviewLanguage='all';
const bkOpenMovieWithReviews=tmdbOpen;
tmdbOpen=async function(id){
  bkReviewTab='butak';bkReviewLanguage='all';bkExternalReviews=[];bkExternalLoading=false;bkExternalError='';bkExternalPage=1;bkExternalTotal=0;bkExternalMovie=Number(id);++bkExternalSeq;
  return bkOpenMovieWithReviews(id);
};
function bkReviewTabs(id){
  return `<section id="bk-reviews"><h2>💬 Críticas y opiniones</h2><div class="bk-review-tabs"><button class="${bkReviewTab==='butak'?'gold':'ghost'}" onclick="bkSelectReviews('butak',${id})">Críticas BUTAK</button><button class="${bkReviewTab==='tmdb'?'gold':'ghost'}" onclick="bkSelectReviews('tmdb',${id})">Críticas TMDB</button></div><div id="bk-review-content">${bkReviewContent(id)}</div></section>`;
}
function bkReviewContent(id){
  if(bkReviewTab==='butak'){
    const r=state.tmdb.reviews[id]||{};
    return `<div class="bk-review-item"><strong>Comunidad BUTAK</strong><p>Las críticas de los demás usuarios aparecerán aquí cuando haya cuentas y servidor. No mostramos reseñas de TMDB como si fueran de BUTAK.</p></div>${r.text?`<div class="bk-review-item"><strong>Tu crítica</strong><div class="bk-review-meta">${r.privacy==='private'?'🔒 Privada':r.privacy==='friends'?'👥 Solo amigos':'🌍 Pública'} · Guardada en este dispositivo</div><div class="bk-review-body">${esc(r.text)}</div></div>`:'<p class="muted">Todavía no has escrito una crítica de esta película. Puedes hacerlo en «Mi crítica», más arriba.</p>'}`;
  }
  if(bkExternalLoading&&!bkExternalReviews.length)return '<p class="muted">Cargando reseñas de TMDB…</p>';
  if(bkExternalError)return `<div class="bk-review-item">${esc(bkExternalError)} <button class="ghost" onclick="bkFetchReviews(${id},1)">Reintentar</button></div>`;
  if(!bkExternalReviews.length)return '<p class="muted">TMDB no devuelve reseñas escritas para esta película, incluso consultando sin filtro de idioma. Esto no significa que no tenga valoraciones numéricas.</p>';
  const visibleReviews=bkReviewLanguage==='all'?bkExternalReviews:bkExternalReviews.filter(r=>bkGuessReviewLanguage(r.content)===bkReviewLanguage);
  const langButtons=`<div class="bk-review-tabs"><button class="${bkReviewLanguage==='all'?'gold':'ghost'}" onclick="bkReviewLanguage='all';bkRefreshReviewPanel(${id})">Todos los idiomas</button><button class="${bkReviewLanguage==='es'?'gold':'ghost'}" onclick="bkReviewLanguage='es';bkRefreshReviewPanel(${id})">Español (aprox.)</button><button class="${bkReviewLanguage==='en'?'gold':'ghost'}" onclick="bkReviewLanguage='en';bkRefreshReviewPanel(${id})">Inglés (aprox.)</button></div>`;
  const cards=visibleReviews.map(r=>{
    const author=r.author||r.author_details?.username||'Usuario TMDB';
    const rating=r.author_details?.rating;
    const when=r.created_at?new Date(r.created_at).toLocaleDateString('es-ES'):'';
    const full=String(r.content||'');const clipped=full.length>1100?full.slice(0,1100)+'…':full;
    const safeUrl=typeof r.url==='string'&&/^https:\/\/(www\.)?themoviedb\.org\//.test(r.url)?r.url:'';
    return `<article class="bk-review-item"><strong>${esc(author)}</strong><div class="bk-review-meta">${rating!==null&&rating!==undefined?'★ '+esc(rating)+'/10 · ':''}${esc(when)} · Fuente: TMDB</div><div class="bk-review-body">${esc(clipped)}</div>${safeUrl?`<p><a href="${esc(safeUrl)}" target="_blank" rel="noopener noreferrer">Leer reseña completa en TMDB ↗</a></p>`:''}</article>`;
  }).join('');
  return `<p class="bk-review-hint">Reseñas originales de usuarios de TMDB, sin mezclarlas con BUTAK. El idioma se estima a partir del texto y puede fallar.</p>${langButtons}${visibleReviews.length?cards:'<p class="muted">No hay reseñas que coincidan con este filtro de idioma. Prueba «Todos los idiomas».</p>'}${bkExternalPage<bkExternalTotal?`<button class="ghost" ${bkExternalLoading?'disabled':''} onclick="bkFetchReviews(${id},${bkExternalPage+1})">${bkExternalLoading?'Cargando…':'Ver más reseñas'}</button>`:''}`;
}
function bkGuessReviewLanguage(content){const t=' '+String(content||'').toLowerCase()+' ';const es=(t.match(/\b(el|la|los|las|que|una|película|pero|muy|con|para|porque|esta|este|es)\b/g)||[]).length;const en=(t.match(/\b(the|and|this|movie|film|with|that|was|were|for|but|have|from)\b/g)||[]).length;return es>en?'es':en>es?'en':'other'}
function bkSelectReviews(tab,id){bkReviewTab=tab;bkRefreshReviewPanel(id);if(tab==='tmdb'&&!bkExternalReviews.length&&!bkExternalLoading&&!bkExternalError)bkFetchReviews(id,1)}
function bkRefreshReviewPanel(id){const el=document.getElementById('bk-reviews');if(el)el.outerHTML=bkReviewTabs(id)}
async function bkFetchReviews(id,pageNo){
  if(!tmdbKey){bkExternalError='Conecta tu clave TMDB para consultar reseñas externas.';bkRefreshReviewPanel(id);return}
  const seq=++bkExternalSeq;bkExternalLoading=true;bkExternalError='';bkRefreshReviewPanel(id);
  try{
    // tmdbRequest defaults to es-ES, which filters out most written reviews.
    // An explicit empty language value is omitted by tmdbRequest, so use a
    // neutral language code and retry in English if TMDB returns no results.
    let data=await tmdbRequest('/movie/'+id+'/reviews',{page:pageNo,language:'en-US'});
    if(seq!==bkExternalSeq||bkExternalMovie!==Number(id))return;
    let results=data.results||[];
    if(pageNo===1){
      const spanish=await tmdbRequest('/movie/'+id+'/reviews',{page:1,language:'es-ES'});
      if(seq!==bkExternalSeq||bkExternalMovie!==Number(id))return;
      results=[...results,...(spanish.results||[])];
    }
    const old=pageNo===1?[]:bkExternalReviews;bkExternalReviews=[...new Map([...old,...results].filter(r=>r&&r.id).map(r=>[r.id,r])).values()];bkExternalPage=pageNo;bkExternalTotal=Math.min(data.total_pages||1,20);
  }catch(e){if(seq!==bkExternalSeq)return;bkExternalError=e.message||'No se pudieron cargar las reseñas.'}
  finally{if(seq===bkExternalSeq){bkExternalLoading=false;bkRefreshReviewPanel(id)}}
}
const bkDetailBeforeReviews=tmdbDetail;
tmdbDetail=function(){let html=bkDetailBeforeReviews();if(!tmdbCurrent||tmdbError)return html;
  const id=tmdbCurrent.id;const footer=tmdbFoot();const reviews=bkReviewTabs(id);
  // Las pestañas se añaden a la ficha completa, no a una pantalla distinta.
  const last=html.lastIndexOf(footer);return last>=0?html.slice(0,last)+reviews+html.slice(last):html+reviews;
};
// Cuando se guarda la crítica propia, la pestaña BUTAK vuelve a reflejar el contenido.
const bkSaveReviewBefore=tmdbSaveReview;
tmdbSaveReview=function(id){bkSaveReviewBefore(id);bkReviewTab='butak';bkRefreshReviewPanel(id)};
document.title='BUTAK 1.3.3 · Cinema Immersive';render();
</script>

<script>
function bkTierGenreLabel(){const entry=bkGenres.find(g=>Number(g[1])===Number(bkChallengeGenre));return entry?entry[0]:'Selecciona un género'}
function bkOpenTierGenres(){
